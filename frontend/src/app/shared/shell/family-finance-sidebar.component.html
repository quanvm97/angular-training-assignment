<aside class="sidebar" aria-label="Primary navigation">
  <a routerLink="/dashboard" class="nav-item" [class.active]="activeItem() === 'dashboard'">
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </span>
    <span>Home</span>
  </a>
  <a routerLink="/monthly-planning" class="nav-item" [class.active]="activeItem() === 'planning'">
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <span>Planning</span>
  </a>
  <a
    routerLink="/expenses/new"
    class="nav-item"
    [class.active]="activeItem() === 'expenses'"
    [queryParams]="expenseDate() ? { expenseDate: expenseDate() } : null"
  >
    <span class="nav-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <span>Add Expense</span>
  </a>
</aside>
